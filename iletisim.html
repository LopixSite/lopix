<!doctype html>
<html lang="tr" data-theme="dark" data-i18n-title="title.contact">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bana Ulaşın — LopiX</title>
  <meta name="description" content="Soru, öneri, hata bildirimi veya iş birliği için LopiX'e ulaşın." data-i18n-attr="content:desc.contact">
  <!-- SEO ve paylaşım önizlemesi. lopixsite.github.io yazan yerleri gerçek site adresiyle değiştir (README: "Site adresini yazmak") -->
  <link rel="canonical" href="https://lopixsite.github.io/iletisim.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LopiX">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:title" content="Bana Ulaşın — LopiX">
  <meta property="og:description" content="Soru, öneri, hata bildirimi veya iş birliği için LopiX'e ulaşın.">
  <meta property="og:url" content="https://lopixsite.github.io/iletisim.html">
  <meta property="og:image" content="https://lopixsite.github.io/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="LopiX logosu ve &quot;Oyun ve yazılım projeleri&quot; yazısı">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="theme-color" content="#050607">
  <script src="assets/js/boot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,700;0,800;1,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Pixelify+Sans:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/main.js" defer></script>
</head>
<body data-page="contact">
  <header class="site-header" data-layout="header"></header>

  <main id="main">
    <div class="container page-head">
      <div class="section-head">
        <p class="eyebrow" data-i18n="contact.eyebrow">İletişim</p>
        <h1 data-i18n="contact.title">Bana Ulaşın</h1>
        <p data-i18n="contact.lead">Soru, öneri, hata bildirimi veya iş birliği için bana yazabilirsiniz.</p>
      </div>
    </div>

    <section class="section">
      <div class="container contact-grid">
        <!-- E-posta -->
        <div class="card">
          <div class="card__head">
            <span class="social-card__icon"><span data-icon="mail"></span></span>
            <h2 data-i18n="contact.email">E-posta</h2>
          </div>
          <p class="email-address" dir="ltr">lopix037@gmail.com</p>
          <div class="card__actions">
            <a class="btn btn--primary btn--sm" href="mailto:lopix037@gmail.com"><span data-icon="mail"></span><span data-i18n="contact.send">E-posta gönder</span></a>
            <button class="btn btn--sm" type="button" data-copy="lopix037@gmail.com"><span data-icon="notes"></span><span data-copy-label data-i18n="contact.copy">Adresi kopyala</span></button>
          </div>
        </div>

        <!-- İletişim formu (Web3Forms).
             Formu açmak için: https://web3forms.com adresinden lopix037@gmail.com ile ücretsiz bir
             "Access Key" al ve aşağıdaki access_key alanının value kısmına yapıştır.
             Bu anahtar sayfa koduna konmak için tasarlanmıştır, gizli bir şifre değildir;
             yalnızca mesajların hangi e-postaya gideceğini belirtir. Boş kaldıkça form kapalı durur. -->
        <div class="card">
          <h2 data-i18n="form.title">Mesaj gönder</h2>
          <form class="form" action="https://api.web3forms.com/submit" method="POST" data-contact-form>
            <input type="hidden" name="access_key" value="">
            <input type="hidden" name="subject" value="LopiX sitesinden yeni mesaj">
            <input type="hidden" name="from_name" value="LopiX Site">
            <!-- Spam botlarını yakalayan görünmez alan (insanlar bunu görmez ve doldurmaz) -->
            <input type="checkbox" name="botcheck" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">

            <div class="form-row">
              <div class="field">
                <label for="name" data-i18n="form.name">Adınız</label>
                <input id="name" name="name" type="text" autocomplete="name" required placeholder="Örn. Ali" data-i18n-attr="placeholder:form.namePh">
              </div>
              <div class="field">
                <label for="email" data-i18n="form.email">E-posta adresiniz</label>
                <input id="email" name="email" type="email" autocomplete="email" required placeholder="ornek@mail.com" data-i18n-attr="placeholder:form.emailPh">
              </div>
            </div>
            <div class="field">
              <label for="message" data-i18n="form.message">Mesajınız</label>
              <textarea id="message" name="message" required placeholder="Mesajınızı yazın…" data-i18n-attr="placeholder:form.messagePh"></textarea>
            </div>
            <div>
              <button class="btn btn--primary" type="submit"><span data-icon="mail"></span><span data-i18n="form.submit">Gönder</span></button>
            </div>
            <p class="form-status" role="status" aria-live="polite" hidden></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-layout="footer"></footer>
</body>
</html>
